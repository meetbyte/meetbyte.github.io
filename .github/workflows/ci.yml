# Unprivileged validation; PR creation with GITHUB_TOKEN requires workflow_dispatch for its first run.
name: PR Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source commit
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Test AI review signal safety
        run: node --test scripts/ai-review-ready.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build static export
        run: npm run build


